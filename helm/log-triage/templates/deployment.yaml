apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-log-triage
  labels:
    app: log-triage
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: log-triage
  template:
    metadata:
      labels:
        app: log-triage
    spec:
      containers:
        - name: log-triage
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: 8080
          env:
            - name: PORT
              value: "8080"
            - name: LLM_MODEL
              value: {{ .Values.llm.model | quote }}
            - name: LLM_BASE_URL
              value: {{ .Values.llm.baseUrl | quote }}
            {{- if .Values.secretName }}
            - name: LLM_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secretName }}
                  key: LLM_API_KEY
                  optional: true
            {{- end }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
